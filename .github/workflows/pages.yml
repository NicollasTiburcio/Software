name: Publicar site com MkDocs Material

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Material for MkDocs
        run: python -m pip install 'mkdocs-material>=9,<10'

      - name: Preparar documentação
              run: |
                mkdir -p docs
                rsync -a \
                  --exclude='/.git/' \
                  --exclude='/.github/' \
                  --exclude='/docs/' \
                  --exclude='/mkdocs.yml' \
                  --exclude='/README.md' \
                  --exclude='/_config.yml' \
                  ./ docs/

      - name: Gerar site
        run: mkdocs build --site-dir "$RUNNER_TEMP/mkdocs-site"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/mkdocs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
